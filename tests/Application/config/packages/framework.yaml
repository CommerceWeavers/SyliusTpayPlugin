framework:
    secret: '%env(APP_SECRET)%'
    form: true
    csrf_protection: true
    session:
        handler_id: ~
    annotations:
        enabled: false
    # The application runs behind a reverse proxy (e.g. Coolify's Caddy) that
    # terminates HTTPS and forwards the request to the container over plain
    # HTTP on port 80. Trusting the proxy and its X-Forwarded-* headers lets
    # Symfony detect the original HTTPS scheme and generate correct HTTPS URLs.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

when@dev:
    framework:
        profiler: { only_exceptions: false }

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
